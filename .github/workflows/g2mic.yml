name: G2 Mic (iOS)

on:
  push:
    paths: ["g2mic/**", ".github/workflows/g2mic.yml"]
  pull_request:
    paths: ["g2mic/**", ".github/workflows/g2mic.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Unit tests (protocol + LC3 audio)
        working-directory: g2mic/Packages/G2Core
        run: swift test

      - name: Generate Xcode project
        working-directory: g2mic
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app + keyboard (iOS Simulator, unsigned)
        working-directory: g2mic
        run: |
          xcodebuild -project G2Mic.xcodeproj -scheme G2Mic \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Build app + keyboard (iOS device, Release, unsigned)
        working-directory: g2mic
        run: |
          xcodebuild -project G2Mic.xcodeproj -scheme G2Mic -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      # An .ipa that a sideloading tool (e.g. on Linux/Windows) re-signs with your Apple ID.
      # It is ad-hoc signed with the App Group entitlement so the re-signer knows the app and
      # keyboard need a shared group.
      - name: Package installable .ipa
        working-directory: g2mic
        run: |
          app="build/Build/Products/Release-iphoneos/G2 Mic.app"
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          cat > ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.com.example.g2mic</string></array>
          </dict></plist>
          PLIST
          codesign --force --sign - --entitlements ent.plist "Payload/G2 Mic.app/PlugIns/G2MicKeyboard.appex"
          codesign --force --sign - --entitlements ent.plist "Payload/G2 Mic.app"
          codesign -d --entitlements - "Payload/G2 Mic.app/PlugIns/G2MicKeyboard.appex" 2>&1 | grep -q "group.com.example.g2mic"
          codesign -d --entitlements - "Payload/G2 Mic.app" 2>&1 | grep -q "group.com.example.g2mic"
          ditto -c -k --sequesterRsrc --keepParent Payload G2Mic.ipa
          ls -lh G2Mic.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: G2Mic-ipa
          path: g2mic/G2Mic.ipa
          if-no-files-found: error
