# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: G2Mic
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Change these two to your own before installing on your iPhone (see README).
    BUNDLE_PREFIX: com.example.g2mic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  G2Core:
    path: Packages/G2Core

targets:
  G2Mic:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: G2Core
      - target: G2MicKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        PRODUCT_NAME: G2 Mic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: App/G2Mic.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: G2 Mic
        G2AppGroup: group.$(BUNDLE_PREFIX)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: G2 Mic connects to your Even Realities G2 glasses to use their microphones.
        NSSpeechRecognitionUsageDescription: G2 Mic turns what you say into the glasses' microphones into text.
        UIBackgroundModes: [bluetooth-central, audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: g2mic
            CFBundleURLSchemes: [g2mic]

  G2MicKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).keyboard
        PRODUCT_NAME: G2MicKeyboard
    entitlements:
      path: Keyboard/G2MicKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX)
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: G2 Mic
        G2AppGroup: group.$(BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true

schemes:
  G2Mic:
    build:
      targets:
        G2Mic: all
        G2MicKeyboard: all
